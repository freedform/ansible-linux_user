- name: Validate linux_user_list variable
  ansible.builtin.assert:
    that:
      - linux_user_list is defined
      - linux_user_list is mapping
      - linux_user_list | length > 0

- name: Deploy linux_user_list
  ansible.builtin.include_tasks: deploy_user.yml
  loop: "{{ linux_user_list | dict2items }}"
  loop_control:
    loop_var: user
    label: "Deploying {{ user.key }}"
  vars:
    user_name: "{{ user.key }}"
    user_data: "{{ user.value }}"
