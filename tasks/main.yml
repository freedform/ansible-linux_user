---
- name: Create linux_user_action_list
  ansible.builtin.set_fact:
    linux_user_action_list: "{{ linux_user_actions.split(',') }}"

- name: Validate linux_user_action_list
  ansible.builtin.assert:
    that:
      - linux_user_action_list | length > 0
      - linux_user_action_list | difference(linux_user_supported_actions) | length == 0

- name: Run linux_user action
  ansible.builtin.include_tasks: "{{ task_name }}.yml"
  loop: "{{ linux_user_action_list }}"
  loop_control:
    loop_var: task_name
